id: https://agentic-vault.example/schema/core
name: agentic-vault-knowledge
version: "0.1.0"
prefixes:
  linkml: https://w3id.org/linkml/
  av: https://agentic-vault.example/schema/
default_prefix: av
default_range: string
imports:
  - linkml:types

classes:
  KnowledgeObject:
    description: Generic semantic object represented canonically in Markdown/YAML.
    slots: [id, knowledge_schema, type, title, aliases, created, updated, status, redirect_to, relations, claims, timeline]
  Entity:
    is_a: KnowledgeObject
  Concept:
    is_a: KnowledgeObject
  Project:
    is_a: Entity
  Person:
    is_a: Entity
  Organization:
    is_a: Entity
  Source:
    is_a: KnowledgeObject
    slots: [source_authority]
  Event:
    is_a: KnowledgeObject
  Decision:
    is_a: KnowledgeObject
  Artifact:
    is_a: KnowledgeObject
  Claim:
    slots: [id, subject, predicate, object, derivation, status, evidence, valid_from, valid_to, recorded_at, event_time, transaction_time, extraction_confidence, claim_confidence, review_status, created_by, reviewed_by]
  Relation:
    slots: [predicate, target, derivation, status, evidence, valid_from, valid_to, recorded_at, event_time, transaction_time, extraction_confidence, claim_confidence, review_status, created_by, reviewed_by]
  Evidence:
    slots: [source, locator_type, locator_value, source_authority]
  TimelineEntry:
    slots: [event_time, transaction_time, claim, source]

slots:
  id:
    identifier: true
    required: true
  knowledge_schema:
    description: Version of the agentic-vault knowledge schema applicable to the object.
  type:
    required: true
  title:
    required: true
  aliases:
    multivalued: true
  created:
    range: date
  updated:
    range: date
  status:
    range: LifecycleStatus
  redirect_to:
    range: string
  source_authority:
    range: SourceAuthority
  relations:
    range: Relation
    multivalued: true
    inlined_as_list: true
  claims:
    range: Claim
    multivalued: true
    inlined_as_list: true
  timeline:
    range: TimelineEntry
    multivalued: true
    inlined_as_list: true
  subject:
    range: string
  predicate:
    required: true
  object:
    range: string
  target:
    range: string
  derivation:
    range: Derivation
  evidence:
    range: Evidence
    multivalued: true
    inlined_as_list: true
  source:
    range: string
  locator_type:
    range: LocatorType
  locator_value:
    range: string
  valid_from:
    range: date
  valid_to:
    range: date
  recorded_at:
    range: datetime
  event_time:
    range: date
  transaction_time:
    range: date
  claim:
    range: string
  extraction_confidence:
    range: float
    minimum_value: 0
    maximum_value: 1
  claim_confidence:
    range: float
    minimum_value: 0
    maximum_value: 1
  review_status:
    range: ReviewStatus
  created_by:
    range: string
  reviewed_by:
    multivalued: true


enums:
  LifecycleStatus:
    permissible_values:
      candidate:
      proposed:
      accepted:
      active:
      superseded:
      retracted:
      retired:
      archived:
      merged:
  Derivation:
    permissible_values:
      asserted:
      extracted:
      inferred:
      ambiguous:
      imported:
  SourceAuthority:
    permissible_values:
      primary:
      secondary:
      tertiary:
      unknown:
  ReviewStatus:
    permissible_values:
      unreviewed:
      pending:
      accepted:
      rejected:
  LocatorType:
    permissible_values:
      file:
      heading:
      obsidian-block:
      line-range:
      url:
      pdf-page:
      timestamp:
      commit:
