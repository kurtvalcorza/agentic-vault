name: Knowledge runtime

on:
  pull_request:
    paths:
      - '.agent/knowledge/**'
      - '.agent/skills/knowledge-runtime/**'
      - '.github/workflows/knowledge-runtime.yml'
  push:
    paths:
      - '.agent/knowledge/**'
      - '.agent/skills/knowledge-runtime/**'
      - '.github/workflows/knowledge-runtime.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e './.agent/knowledge[test]'
      - run: pytest -q .agent/knowledge/tests
      - run: vault-knowledge --vault . validate
