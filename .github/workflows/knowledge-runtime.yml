name: Knowledge runtime

on:
  pull_request:
    paths:
      - '.agent/knowledge/**'
      - '.agent/skills/knowledge-runtime/**'
      - '.github/workflows/knowledge-runtime.yml'
      # Match the validator's scan scope: iter_markdown() walks every *.md in the
      # vault, so any Markdown change anywhere must run whole-vault validation.
      - '**/*.md'
      - '*.md'
  push:
    paths:
      - '.agent/knowledge/**'
      - '.agent/skills/knowledge-runtime/**'
      - '.github/workflows/knowledge-runtime.yml'
      # Match the validator's scan scope: iter_markdown() walks every *.md in the
      # vault, so any Markdown change anywhere must run whole-vault validation.
      - '**/*.md'
      - '*.md'

jobs:
  test:
    # Windows is a first-class target: setup.ps1 wires the agent skills
    # directories together with NTFS junctions, and the runtime's path-safety
    # rules (symlink escape, vault-root containment) behave differently there.
    # Testing only on Linux left that platform's behaviour unverified.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
    defaults:
      run:
        # The install step quotes a POSIX-style extras path; pin bash so the
        # Windows runner does not reinterpret it under pwsh.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e './.agent/knowledge[test,linkml]'
      - run: pytest -q .agent/knowledge/tests
      - run: vault-knowledge --vault . validate
      - run: vault-knowledge --vault . build --full
      - run: vault-knowledge --vault . health
