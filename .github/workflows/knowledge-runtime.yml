name: Knowledge runtime

on:
  pull_request:
    paths:
      - '.agent/knowledge/**'
      - '.agent/skills/knowledge-runtime/**'
      - '.github/workflows/knowledge-runtime.yml'
      # Canonical knowledge locations: a note-only change must still run
      # whole-vault semantic validation (duplicate IDs, invalid claims, etc.).
      - 'Inbox/**'
      - '01_Projects/**'
      - '02_Areas/**'
      - '03_Resources/**'
      - '04_Archives/**'
  push:
    paths:
      - '.agent/knowledge/**'
      - '.agent/skills/knowledge-runtime/**'
      - '.github/workflows/knowledge-runtime.yml'
      # Canonical knowledge locations: a note-only change must still run
      # whole-vault semantic validation (duplicate IDs, invalid claims, etc.).
      - 'Inbox/**'
      - '01_Projects/**'
      - '02_Areas/**'
      - '03_Resources/**'
      - '04_Archives/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e './.agent/knowledge[test,linkml]'
      - run: pytest -q .agent/knowledge/tests
      - run: vault-knowledge --vault . validate
      - run: vault-knowledge --vault . build --full
      - run: vault-knowledge --vault . health
